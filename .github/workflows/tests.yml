name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Tutorial 7 suite (provided tests)
      - name: Run tutorial 7 tests
        working-directory: tutorial_7
        run: python -m unittest discover -v

      # Tutorial 6 suite (tests written for this tutorial)
      - name: Run tutorial 6 tests
        working-directory: tutorial_6
        run: python -m unittest discover -v
